name: Publish queued article
on:
  schedule:
    # 08:00 Warsaw: 06:00 UTC in summer, 07:00 UTC in winter.
    - cron: '0 6,7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scheduled-articles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish next queued Markdown article
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/publish-queued.mjs
      - name: Commit published article
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- content/ planned/)" ]; then
            echo "No article to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ planned/
          git commit -m "Publish next planned Poza Szumem article"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Trigger site build and deployment
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref main
